name: Add country landscape photographs
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/download_landscapes.py'
permissions:
  contents: write
jobs:
  add-landscapes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - run: python scripts/download_landscapes.py
      - name: Commit licensed photos and credits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add landscapes/
          git diff --cached --quiet || (git commit -m "Add credited landmark photos for 11 countries" && git push)
